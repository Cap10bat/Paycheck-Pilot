<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paycheck Pilot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Supabase Configuration
        const SUPABASE_URL = "https://zsfcqymmlzpfaapygmlu.supabase.co";
        const SUPABASE_KEY = "sb_publishable_pr_leMR3cM00zA7lI7Tcmw_baAT4Zvp";
        const SYNC_TABLE = "paycheck_pilot_sync";
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error("Supabase initialization error:", e);
        }

        function App() {
            // User & Mode State - Restricted owner account configured to cap10bat@yahoo.com
            const [user, setUser] = useState({
                email: "cap10bat@yahoo.com",
                isOwner: true,
                isDeveloperModeEnabled: true
            });

            // Navigation State
            const [currentTab, setCurrentTab] = useState("Dashboard");
            const [settingsTab, setSettingsTab] = useState("Profile");

            // Budgeting & Forecasting Engine State
            const [transactions, setTransactions] = useState([
                { id: 1, title: "Salary Deposit", amount: 3200, type: "income", date: "2026-08-01" },
                { id: 2, title: "Rent / Mortgage", amount: 1400, type: "expense", date: "2026-08-02" },
                { id: 3, title: "Grocery Store", amount: 150, type: "expense", date: "2026-08-05" }
            ]);

            const [goals, setGoals] = useState([
                { id: 1, title: "Emergency Fund", target: 10000, current: 6500 },
                { id: 2, title: "Vacation Fund", target: 2500, current: 1200 }
            ]);

            // Cloud Sync State
            const [syncStatus, setSyncStatus] = useState("Idle");
            const [lastSynced, setLastSynced] = useState(null);

            // Cloud Sync Function
            const handleCloudSync = async () => {
                if (!supabaseClient) {
                    setSyncStatus("Supabase Client Unavailable");
                    return;
                }
                setSyncStatus("Syncing...");
                try {
                    const payload = {
                        user_email: user.email,
                        transactions,
                        goals,
                        updated_at: new Date().toISOString()
                    };
                    const { error } = await supabaseClient
                        .from(SYNC_TABLE)
                        .upsert({ user_email: user.email, data: payload }, { onConflict: 'user_email' });

                    if (error) throw error;
                    setSyncStatus("Synced Successfully");
                    setLastSynced(new Date().toLocaleTimeString());
                } catch (err) {
                    console.error(err);
                    setSyncStatus("Sync Failed (Check console)");
                }
            };

            // Budgeting Calculations Engine
            const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const totalExpense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            const netBalance = totalIncome - totalExpense;
            const forecastedNextMonth = netBalance * 1.05; // 5% projected growth model

            // Strict authorization check: Developer access restricted specifically to cap10bat@yahoo.com owner account
            const isDeveloperAuthorized = Boolean(
                user.email === "cap10bat@yahoo.com" && 
                user.isOwner && 
                user.isDeveloperModeEnabled
            );

            return (
                <div className="flex h-screen overflow-hidden bg-slate-950 text-slate-100">
                    {/* Sidebar Navigation */}
                    <aside className="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
                        <div>
                            {/* Branding Header */}
                            <div className="p-6 border-b border-slate-800 flex items-center space-x-3">
                                <img src="paycheck-pilot-hero.png" alt="Paycheck Pilot Logo" className="w-10 h-10 rounded-lg object-cover bg-indigo-600" onError={(e)=>{e.target.style.display='none'}} />
                                <div>
                                    <h1 className="font-bold text-lg text-white">Paycheck Pilot</h1>
                                    <p className="text-xs text-slate-400">Financial Command Center</p>
                                </div>
                            </div>

                            {/* Normal User Navigation Items */}
                            <nav className="p-4 space-y-1">
                                <p className="px-3 text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Main Menu</p>
                                {["Dashboard", "Coming Up", "Transactions", "Goals", "Forecast", "Activity Log", "Settings"].map((tab) => (
                                    <button
                                        key={tab}
                                        onClick={() => setCurrentTab(tab)}
                                        className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                                            currentTab === tab 
                                                ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                                                : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                                        }`}
                                    >
                                        {tab}
                                    </button>
                                ))}
                            </nav>

                            {/* Developer Section Navigation (Strictly restricted to cap10bat@yahoo.com owner account) */}
                            {isDeveloperAuthorized && (
                                <nav className="p-4 pt-2 space-y-1 border-t border-slate-800 mt-2">
                                    <div className="flex items-center justify-between px-3 mb-2">
                                        <p className="text-xs font-semibold uppercase tracking-wider text-amber-400">Developer Section</p>
                                        <span className="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded">Owner Only</span>
                                    </div>
                                    {[
                                        "Sponsor Management",
                                        "Sponsor Analytics",
                                        "Developer Diagnostics",
                                        "Sponsor Testing",
                                        "CTR Reporting",
                                        "Partner URLs",
                                        "Developer Sponsor Tools",
                                        "Developer Sponsor Testing"
                                    ].map((devTab) => (
                                        <button
                                            key={devTab}
                                            onClick={() => setCurrentTab(devTab)}
                                            className={`w-full flex items-center px-3 py-2 rounded-lg text-xs font-medium transition-colors ${
                                                currentTab === devTab 
                                                    ? 'bg-amber-600 text-white shadow-lg shadow-amber-600/30' 
                                                    : 'text-slate-400 hover:bg-slate-800 hover:text-amber-300'
                                            }`}
                                        >
                                            {devTab}
                                        </button>
                                    ))}
                                </nav>
                            )}
                        </div>

                        {/* Account & Developer Mode Switcher for Testing */}
                        <div className="p-4 border-t border-slate-800 bg-slate-900/50 space-y-3">
                            <div>
                                <label className="text-[11px] text-slate-400 block mb-1">Active User Email</label>
                                <select 
                                    value={user.email}
                                    onChange={(e) => {
                                        const email = e.target.value;
                                        const isOwnerAcc = email === "cap10bat@yahoo.com";
                                        setUser({
                                            email,
                                            isOwner: isOwnerAcc,
                                            isDeveloperModeEnabled: isOwnerAcc
                                        });
                                        if (!isOwnerAcc && ["Sponsor Management", "Sponsor Analytics", "Developer Diagnostics", "Sponsor Testing", "CTR Reporting", "Partner URLs", "Developer Sponsor Tools", "Developer Sponsor Testing"].includes(currentTab)) {
                                            setCurrentTab("Dashboard");
                                        }
                                    }}
                                    className="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded p-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                >
                                    <option value="cap10bat@yahoo.com">cap10bat@yahoo.com (Owner)</option>
                                    <option value="normaluser@paycheckpilot.com">normaluser@paycheckpilot.com (Normal User)</option>
                                </select>
                            </div>
                            <div className="flex items-center justify-between">
                                <span className="text-xs text-slate-400">Dev Mode Enabled</span>
                                <input 
                                    type="checkbox" 
                                    checked={user.isDeveloperModeEnabled}
                                    onChange={(e) => setUser({...user, isDeveloperModeEnabled: e.target.checked})}
                                    className="rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-indigo-500"
                                />
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col overflow-y-auto">
                        <header className="h-16 border-b border-slate-800 bg-slate-900/60 backdrop-blur flex items-center justify-between px-8 sticky top-0 z-10">
                            <h2 className="text-xl font-bold text-white">{currentTab}</h2>
                            <div className="flex items-center space-x-4">
                                <span className="text-xs text-slate-400">Cloud Sync: <strong className="text-slate-200">{syncStatus}</strong></span>
                                <button 
                                    onClick={handleCloudSync}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition-colors shadow"
                                >
                                    Sync Now
                                </button>
                            </div>
                        </header>

                        <div className="p-8 max-w-7xl w-full mx-auto flex-1">
                            {/* NORMAL USER VIEWS */}
                            {currentTab === "Dashboard" && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                            <p className="text-sm text-slate-400">Total Income</p>
                                            <h3 className="text-3xl font-bold text-emerald-400 mt-2">${totalIncome.toLocaleString()}</h3>
                                        </div>
                                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                            <p className="text-sm text-slate-400">Total Expenses</p>
                                            <h3 className="text-3xl font-bold text-rose-400 mt-2">${totalExpense.toLocaleString()}</h3>
                                        </div>
                                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                            <p className="text-sm text-slate-400">Net Balance</p>
                                            <h3 className="text-3xl font-bold text-indigo-400 mt-2">${netBalance.toLocaleString()}</h3>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                        <h3 className="text-lg font-semibold mb-4 text-white">Recent Budget Activity</h3>
                                        <div className="space-y-3">
                                            {transactions.map(t => (
                                                <div key={t.id} className="flex justify-between items-center p-3 bg-slate-950 rounded-lg border border-slate-800/60">
                                                    <div>
                                                        <p className="font-medium text-slate-200">{t.title}</p>
                                                        <p className="text-xs text-slate-500">{t.date}</p>
                                                    </div>
                                                    <span className={`font-semibold ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                        {t.type === 'income' ? '+' : '-'}${t.amount}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentTab === "Coming Up" && (
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                    <h3 className="text-lg font-semibold mb-2 text-white">Upcoming Paychecks & Bills</h3>
                                    <p className="text-sm text-slate-400">Scheduled financial obligations for the upcoming cycles.</p>
                                </div>
                            )}

                            {currentTab === "Transactions" && (
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                    <h3 className="text-lg font-semibold mb-4 text-white">All Transactions</h3>
                                    <div className="space-y-2">
                                        {transactions.map(t => (
                                            <div key={t.id} className="flex justify-between p-3 bg-slate-950 rounded-lg">
                                                <span>{t.title}</span>
                                                <span>${t.amount}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {currentTab === "Goals" && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {goals.map(g => (
                                        <div key={g.id} className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                            <h4 className="font-semibold text-white">{g.title}</h4>
                                            <p className="text-sm text-slate-400 mt-1">${g.current} of ${g.target}</p>
                                            <div className="w-full bg-slate-800 h-2 rounded-full mt-4 overflow-hidden">
                                                <div className="bg-indigo-600 h-full" style={{ width: `${(g.current / g.target) * 100}%` }}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {currentTab === "Forecast" && (
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
                                    <h3 className="text-lg font-semibold text-white">Financial Forecasting Engine</h3>
                                    <p className="text-sm text-slate-300">Based on your current savings rate, your projected next month balance is:</p>
                                    <div className="text-3xl font-bold text-emerald-400">${forecastedNextMonth.toLocaleString()}</div>
                                </div>
                            )}

                            {currentTab === "Activity Log" && (
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                    <h3 className="text-lg font-semibold mb-2 text-white">System & User Activity Log</h3>
                                    <p className="text-sm text-slate-400">All synchronization and transaction events recorded securely.</p>
                                </div>
                            )}

                            {currentTab === "Settings" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col md:flex-row min-h-[400px]">
                                    {/* Settings Subnavigation - Strictly 8 items for normal users */}
                                    <div className="w-full md:w-64 border-b md:border-b-0 md:border-r border-slate-800 p-4 space-y-1 bg-slate-950/40">
                                        <p className="px-3 text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Settings Menu</p>
                                        {["Profile", "Cloud Sync", "Theme", "About", "Privacy", "Terms", "Contact", "Logout"].map((sTab) => (
                                            <button
                                                key={sTab}
                                                onClick={() => setSettingsTab(sTab)}
                                                className={`w-full flex items-center px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
                                                    settingsTab === sTab 
                                                        ? 'bg-slate-800 text-indigo-400' 
                                                        : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                                                }`}
                                            >
                                                {sTab}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex-1 p-6">
                                        <h3 className="text-xl font-bold text-white mb-4">{settingsTab}</h3>
                                        <p className="text-sm text-slate-400">Configuration panel for {settingsTab.toLowerCase()}. All sponsor management tools are strictly restricted to owner accounts.</p>
                                    </div>
                                </div>
                            )}

                            {/* DEVELOPER SECTION VIEWS (Protected strictly for cap10bat@yahoo.com) */}
                            {isDeveloperAuthorized && [
                                "Sponsor Management",
                                "Sponsor Analytics",
                                "Developer Diagnostics",
                                "Sponsor Testing",
                                "CTR Reporting",
                                "Partner URLs",
                                "Developer Sponsor Tools",
                                "Developer Sponsor Testing"
                            ].includes(currentTab) ? (
                                <div className="bg-slate-900 border border-amber-500/30 p-6 rounded-xl space-y-4">
                                    <div className="flex items-center space-x-2 text-amber-400 font-semibold border-b border-slate-800 pb-3">
                                        <span>🔒 Restricted Owner Control Panel ({user.email})</span>
                                    </div>
                                    <h3 className="text-xl font-bold text-white">{currentTab}</h3>
                                    <p className="text-sm text-slate-300">Administrative tools, configurations, and analytics for {currentTab}. Strictly invisible to normal users.</p>
                                    <div className="p-4 bg-slate-950 rounded-lg border border-slate-800 font-mono text-xs text-amber-300/80">
                                        Status: SECURE / OWNER VERIFIED (cap10bat@yahoo.com) / SUPABASE SYNC ACTIVE
                                    </div>
                                </div>
                            ) : null}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
